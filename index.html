<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AVIATOR - ouma Jonathan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial}
html,body{height:100%;width:100%;background:#0d111c;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;width:100vw}
.top{width:100%;display:flex;flex-direction:column;align-items:center;padding:8px;background:linear-gradient(#151b2b,#0d111c);flex-shrink:0;border-bottom:2px solid #00e676}
.bigAvatar{width:135px;height:135px;border-radius:50%;border:5px solid #00e676;object-fit:cover;box-shadow:0 0 30px rgba(0,230,118,0.7)}
.name{margin-top:8px;font-size:20px;font-weight:900;color:#fff}
.sub{font-size:12px;color:#00e676;font-weight:900}
.bal{margin-top:6px;background:#1e2940;padding:6px 20px;border-radius:20px;color:#00e676;font-weight:900;font-size:16px;border:2px solid #00e676}
.hist{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#0d111c;flex-shrink:0}
.hist span{padding:5px 12px;border-radius:15px;font-size:14px;font-weight:900;background:#1c2336}
#game{flex:1;width:100%;background:radial-gradient(ellipse at bottom,#1a233a 0%,#080a12 70%);position:relative;overflow:hidden;min-height:35vh}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#plane{position:absolute;z-index:2;font-size:36px;left:0;top:0}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:3;width:100%}
#mult{font-size:95px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 30px #fff, 0 0 60px rgba(255,255,255,0.5)}
#flew{color:#ff3b3b;display:none;font-size:26px;font-weight:900;margin-top:8px}
.bets{width:100%;display:flex;gap:8px;padding:10px;background:#0d111c;flex-shrink:0;min-height:38vh}
.card{flex:1;min-width:0;background:#1a2236;border-radius:16px;padding:12px;border:2px solid #2a3a5c;display:flex;flex-direction:column}
.cardTitle{font-size:12px;color:#8a9cc5;font-weight:900;margin-bottom:6px}
.inputBox{width:100%;background:#0f1525;border:2px solid #2a3a5c;border-radius:24px;display:flex;align-items:center;padding:4px}
.inputBox button{width:42px;min-width:42px;height:42px;border-radius:50%;border:none;background:#243150;color:#fff;font-weight:900;font-size:24px}
.inputBox input{flex:1;min-width:0;background:transparent;border:none;color:#fff;text-align:center;font-size:26px;font-weight:900;outline:none}
.quicks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.quicks button{width:100%;background:#23304e;border:none;color:#fff;padding:10px 0;border-radius:8px;font-size:14px;font-weight:900}
.betBtn{width:100%;margin-top:auto;border:none;border-radius:20px;padding:18px 0;font-weight:900;font-size:20px;color:#fff;cursor:pointer;line-height:1.1}
.betBtn span{font-size:15px;display:block;margin-top:3px}
.green{background:linear-gradient(#00e676,#00c74d);box-shadow:0 4px 15px rgba(0,230,118,0.4)}
.orange{background:linear-gradient(#ffb700,#ff7b00);animation:pulse 0.5s infinite;box-shadow:0 4px 20px rgba(255,159,0,0.6);font-size:22px!important}
.grey{background:#2a395a;color:#aab8d6}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.foot{text-align:center;padding:3px;color:#4a5a7a;font-size:8px}
</style>
</head>
<body>
<div class="top">
<img src="IMG-20260826-WA0039.jpg" class="bigAvatar" onerror="this.src='avatar.jpg';this.onerror=null">
<div class="name">JONATHAN MENTOR ✈️</div>
<div class="sub">AVIATOR KING • UGANDA</div>
<div class="bal">💰 UGX <span id="bal">100,000</span> FUN</div>
</div>
<div class="hist" id="hist"></div>
<div id="game"><canvas id="cv"></canvas><div id="plane">✈️</div><div id="center"><div id="mult">1.00x</div><div id="flew">FLEW AWAY!</div></div></div>
<div class="bets">
<div class="card">
<div class="cardTitle">BET 1</div>
<div class="inputBox"><button onclick="ch(1,-100)">−</button><input id="s1" type="number" value="500"><button onclick="ch(1,100)">+</button></div>
<div class="quicks"><button onclick="setS(1,500)">500</button><button onclick="setS(1,1000)">1K</button><button onclick="setS(1,2000)">2K</button><button onclick="setS(1,5000)">5K</button></div>
<button id="b1" class="betBtn green" onclick="bet(1)">BET <span id="b1t">500 UGX</span></button>
</div>
<div class="card">
<div class="cardTitle">BET 2</div>
<div class="inputBox"><button onclick="ch(2,-100)">−</button><input id="s2" type="number" value="500"><button onclick="ch(2,100)">+</button></div>
<div class="quicks"><button onclick="setS(2,500)">500</button><button onclick="setS(2,1000)">1K</button><button onclick="setS(2,2000)">2K</button><button onclick="setS(2,5000)">5K</button></div>
<button id="b2" class="betBtn green" onclick="bet(2)">BET <span id="b2t">500 UGX</span></button>
</div>
</div>
<div class="foot">JONATHAN MENTOR AVIATOR</div>
<script>
let bal=100000, mult=1, flying=false, crash=2, pts=[], roundId=0;
let cv=document.getElementById('cv'), ctx=cv.getContext('2d'), plane=document.getElementById('plane'), multEl=document.getElementById('mult'), flew=document.getElementById('flew'), hist=document.getElementById('hist'), game=document.getElementById('game');
let s1=document.getElementById('s1'), s2=document.getElementById('s2'), b1=document.getElementById('b1'), b2=document.getElementById('b2'), b1t=document.getElementById('b1t'), b2t=document.getElementById('b2t'), balEl=document.getElementById('bal');
let B1={stake:500,placed:false,active:false,round:-1}, B2={stake:500,placed:false,active:false,round:-1};
function resize(){ let r=game.getBoundingClientRect(); cv.width=r.width; cv.height=r.height; }
window.addEventListener('resize',resize); resize();
function upd(n){ let v=parseInt((n==1?s1:s2).value)||0; if(n==1){B1.stake=v; b1t.innerText=v.toLocaleString()+' UGX';}else{B2.stake=v; b2t.innerText=v.toLocaleString()+' UGX';} }
function ch(n,d){ let el=n==1?s1:s2; let v=(parseInt(el.value)||500)+d; if(v<100) v=100; el.value=v; upd(n); }
function setS(n,v){ (n==1?s1:s2).value=v; upd(n); }
function draw(){ let w=cv.width,h=cv.height; ctx.clearRect(0,0,w,h); if(pts.length<2) return; ctx.beginPath(); ctx.strokeStyle='#ff1a1a'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke(); ctx.lineTo(pts[pts.length-1].x,h); ctx.lineTo(pts[0].x,h); ctx.closePath(); ctx.fillStyle='rgba(255,26,26,0.3)'; ctx.fill(); }
function addH(m){ let s=document.createElement('span'); s.innerText=m.toFixed(2)+'x'; s.style.color=m<2?'#ff4d4d':m<10?'#7aa3ff':'#00e676'; hist.prepend(s); if(hist.children.length>22) hist.lastChild.remove(); }
function bet(n){
 let B=n==1?B1:B2, btn=n==1?b1:b2;
 let stake=parseInt((n==1?s1:s2).value)||0;
 if(stake<100){alert('Min 100'); return;}
 B.stake=stake;
 // CASH OUT NOW
 if(flying && B.placed && B.active && B.round==roundId){
   let win=Math.floor(B.stake*mult);
   bal+=win; balEl.innerText=bal.toLocaleString();
   B.placed=false; B.active=false;
   btn.className='betBtn green';
   btn.innerHTML=`BET <span>${B.stake.toLocaleString()} UGX</span>`;
   // flash win
   multEl.innerText='+'+win.toLocaleString()+' UGX';
   multEl.style.color='#00e676';
   return;
 }
 // PLACE BET
 if(!B.placed){
   if(stake>bal){alert('No balance!'); return;}
   bal-=stake; balEl.innerText=bal.toLocaleString();
   B.placed=true;
   if(flying){
     B.round=roundId+1;
     B.active=false;
     btn.className='betBtn grey';
     btn.innerHTML=`NEXT ROUND <span>${stake.toLocaleString()} UGX</span>`;
   } else {
     B.round=roundId;
     B.active=false;
     btn.className='betBtn grey';
     btn.innerHTML=`WAITING <span>${stake.toLocaleString()} UGX</span>`;
   }
 }
}
function start(){
 mult=1; flying=false; pts=[];
 flew.style.display='none'; multEl.style.color='#fff';
 // move next round bets to current
 [B1,B2].forEach(B=>{ if(B.placed && B.round==roundId){ B.round=roundId; } });
 setTimeout(()=>{
   roundId++;
   // activate waiting bets for this round
   [B1,B2].forEach(B=>{ if(B.placed && B.round==roundId-1){ B.round=roundId; B.active=true; } else if(B.placed && B.round==roundId){ B.active=true; } });
   flying=true; crash = Math.random()<0.15? 1.08+Math.random()*0.8 : 1.2+Math.pow(Math.random(),1.25)*30;
   let t0=Date.now();
   function loop(){
     if(!flying) return;
     let e=(Date.now()-t0)/1000;
     mult=1+ e*0.65 + Math.pow(e,1.95)*0.06;
     let w=cv.width,h=cv.height;
     let x=(mult-1)*w*0.16; if(x>w-40) x=w-40;
     let y=h - (mult-1)*h*0.14 - h*0.28; if(y<10) y=10;
     pts.push({x,y}); if(pts.length>200) pts.shift();
     draw(); plane.style.left=(x-16)+'px'; plane.style.top=(y-20)+'px';
     multEl.innerText=mult.toFixed(2)+'x';
     multEl.style.color='#fff';
     [B1,B2].forEach((B,i)=>{
       let btn=i==0?b1:b2;
       if(B.placed && B.active && B.round==roundId){
         let cash=Math.floor(B.stake*mult);
         btn.className='betBtn orange';
         btn.innerHTML=`CASH OUT <span>${cash.toLocaleString()} UGX</span>`;
       }
     });
     if(mult>=crash){
       flying=false;
       multEl.style.color='#ff3b3b'; flew.style.display='block';
       [B1,B2].forEach((B,i)=>{
         if(B.placed && B.active && B.round==roundId){
           B.placed=false; B.active=false;
           let btn=i==0?b1:b2;
           btn.className='betBtn green';
           btn.innerHTML=`BET <span>${B.stake.toLocaleString()} UGX</span>`;
         }
       });
       addH(mult);
       setTimeout(start,2000);
       return;
     }
     requestAnimationFrame(loop);
   }
   loop();
 }, 500);
}
s1.addEventListener('input',()=>upd(1)); s2.addEventListener('input',()=>upd(2));
upd(1); upd(2); start();
</script>
</body>
 </html>
