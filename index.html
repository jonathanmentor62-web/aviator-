<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HATHAN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080a14;color:white;font-family:Arial}
.banner{background:#000;padding:12px;text-align:center;border-bottom:2px solid #ff0000}
.banner h1{color:#ff0000;font-size:32px;font-weight:900;font-style:italic}
.top-links{background:#111;padding:8px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:12px}
.top-links a{color:#aaa;text-decoration:none;padding:6px 12px;border:1px solid #333;border-radius:20px}
.btns{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px}
.btns a{padding:5px 10px;border-radius:4px;font-weight:bold;font-size:11px;text-decoration:none;text-align:center}
.depo{background:#ffcc00;color:#000}.with{background:#222;color:white;border:1px solid #555}.join{background:#ff0000;color:white}
.nav{background:#1a1d2e;padding:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nav a{padding:8px 18px;border-radius:20px;text-decoration:none;font-weight:bold;font-size:13px}
.nav-avi{background:#ffcc00;color:#000}.nav-bet{background:#00aaff;color:white}.nav-live{background:#00ff00;color:#000}.nav-casino{background:#ff0000;color:white}
.box{margin:10px;background:#171a2a;border-radius:12px;padding:20px;text-align:center}
.mult{font-size:55px;color:#ffcc00;font-weight:bold}
</style>
</head>
<body>
<div style="position:relative">
<div class="banner"><h1>HATHAN</h1></div>
<div class="btns">
<a href="deposit.html" class="depo">+ DEPOSIT</a>
<a href="withdraw.html" class="with">WITHDRAW</a>
<a href="join.html" class="join">JOIN NOW</a>
</div>
</div>
<div class="top-links">
<a href="bet.html">⚽ BET</a>
<a href="live.html">🔴 LIVE SPORTS</a>
<a href="casino.html">🎰 CASINO</a>
<a href="deposit.html">💰 DEPOSIT</a>
<a href="withdraw.html">💸 WITHDRAW</a>
<a href="join.html" style="background:#ff0000;color:white">🔐 JOIN NOW</a>
</div>
<div class="nav">
<a href="index.html" class="nav-avi">✈️ AVIATOR</a>
<a href="bet.html" class="nav-bet">⚽ FOOTBALL</a>
<a href="casino.html" class="nav-casino">🎰 CASINO</a>
</div>
<div class="box">
<h2 style="color:#ffcc00">✈️ HATHAN AVIATOR</h2>
<div class="mult" id="m">1.00x</div>
<div style="font-size:40px" id="pl">✈️</div>
<button id="b" style="padding:14px;width:100%;background:#00d632;border:none;border-radius:8px;font-weight:bold" onclick="go()">BET 1000 UGX</button>
<button id="c" style="padding:14px;width:100%;background:#ff2222;color:white;border:none;border-radius:8px;font-weight:bold;display:none" onclick="out()">CASHOUT</button>
<p id="s" style="margin-top:10px;color:#888">Welcome to HATHAN</p>
</div>
<script>
let p=false,cur=1,cr=0,iv;
function go(){if(p)return;p=true;cur=1;cr=(Math.random()*10+1.2).toFixed(2);b.style.display='none';c.style.display='block';iv=setInterval(()=>{cur+=0.07;m.innerHTML=cur.toFixed(2)+'x';if(cur>=cr){clearInterval(iv);m.innerHTML='💥 '+cur.toFixed(2)+'x';b.style.display='block';c.style.display='none';p=false;}},80);}
function out(){clearInterval(iv);s.innerHTML='WON '+(cur*1000).toFixed(0)+' UGX';b.style.display='block';c.style.display='none';p=false;}
</script>
</body>
  </html>
