<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator - Jonathan Mentor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0e0e0e;color:white;overflow:hidden}
.header{background:#1a1a1a;padding:15px;display:flex;justify-content:space-between;align-items:center}
.balance{background:#2a2a2a;padding:8px 15px;border-radius:20px;color:#00ff88;font-weight:bold}
.game-area{position:relative;height:55vh;background:linear-gradient(to bottom,#1a1a2e 0%,#16213e 50%,#0f3460 100%);overflow:hidden;border-bottom:3px solid #ff0040}
#canvas{width:100%;height:100%}
.multiplier{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;font-weight:bold;color:white;text-shadow:0 0 20px #ff0040}
.crashed{color:#ff0040 !important;animation:shake 0.5s}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-48%,-50%)}75%{transform:translate(-52%,-50%)}}
.controls{padding:20px;background:#1a1a1a}
.bet-box{display:flex;gap:10px;margin-bottom:15px}
.bet-box input{flex:1;padding:15px;border-radius:10px;border:none;background:#2a2a2a;color:white;font-size:18px;text-align:center}
.btn{flex:1;padding:18px;border:none;border-radius:12px;font-size:20px;font-weight:bold;cursor:pointer}
.bet-btn{background:#00c853;color:white}
.cashout-btn{background:#ff3d00;color:white;display:none}
.history{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#121212}
.hist{padding:5px 10px;border-radius:15px;font-size:12px;font-weight:bold}
