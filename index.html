<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aviator - Jonathan Mentor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#121212;color:#fff;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.header{background:#1b1b1b;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #2a2a2a}
.logo{color:#e11d48;font-weight:900;font-size:18px}
.logo span{color:#fff}
.balBox{display:flex;gap:8px;align-items:center}
.balBox.bal{background:#2c2c2c;padding:6px 12px;border-radius:6px;font-weight:700;font-size:14px;color:#00e676}
.btnSmall{border:none;padding:6px 14px;border-radius:6px;font-weight:800;font-size:12px;color:#fff;cursor:pointer}
.dep{background:#00c74d}.with{background:#ff8f00}
.main{display:flex;flex:1;overflow:hidden}
.left{width:32%;min-width:130px;background:#1b1b1b;border-right:1px solid #2a2a2a;overflow-y:auto;padding:6px}
.left h4{font-size:10px;color:#888;margin:6px 0}
.betItem{display:flex;justify-content:space-between;font-size:11px;padding:5px 6px;background:#232323;border-radius:4px;margin-bottom:3px}
.betItem b{color:#00e676}
.center{flex:1;display:flex;flex-direction:column;background:#0e0e0e}
.hist{display:flex;gap:4px;padding:6px;overflow-x:auto;background:#171717;border-bottom:1px solid #2a2a2a}
.hist span{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#2a2a2a;flex-shrink:0}
#game{flex:1;position:relative;background:radial-gradient(ellipse at center bottom,#1e1e1e 0%,#0a0a0a 80%);overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#plane{position:absolute;z-index:2;font-size:28px}
#center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;z-index:3;width:100%}
#mult{font-size:72px;font-weight:900;color:#fff;text-shadow:0 0 15px rgba(255,255,255,0.3)}
#flew{color:#e11d48;display:none;font-size:20px;font-weight:900}
.betArea{display:flex;gap:8px;padding:8px;background:#171717;border-top:1px solid #2a2a2a}
.betCard{flex:1;background:#232323;border-radius:10px;padding:8px;border:1px solid #333;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;margin-bottom:6px}
.tabs button{flex:1;padding:5px;font-size:10px;border:none;border-radius:5px;background:#333;color:#aaa;font-weight:700}
.tabs button.active{background:#444;color:#fff}
.inputRow{display:flex;align-items:center;gap:4px;background:#121212;border-radius:20px;padding:4px;border:1px solid #333}
.inputRow button{width:44px;min-width:44px;height:44px;border-radius:50%;border:none;background:#2a2a2a;color:#fff;font-size:22px;font-weight:900}
.inputRow input{flex:1;background:transparent;border:none;color:#fff;text-align:center;font-size:32px;font-weight:900;outline:none;width:100%}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.grid4 button{background:#2a2a2a;border:none;color:#fff;padding:8px 0;border-radius:6px;font-size:12px;font-weight:700}
.betBtn{width:100%;margin-top:8px;border:none;border-radius:10px;padding:14px 0;font-weight:900;font-size:16px;color:#fff;cursor:pointer;border-bottom:3px solid rgba(0,0,0,0.3)}
.betBtn span{font-size:12px;display:block;opacity:0.9}
.green{background:#22c55e}.orange{background:#f59e0b;animation:pulse 0.5s infinite alternate}.grey{background:#3a3a3a}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.03)}}
.modal{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:99;justify-content:center;align-items:center}
.modalBox{background:#232323;padding:20px;border-radius:12px;width:90%;max-width:320px;text-align:center}
.modalBox h3{margin-bottom:10px}
.modalBox input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#121212;color:#fff;margin:6px 0;font-size:16px}
.modalBox button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;margin-top:8px;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div class="logo">✈️ AVIATOR <span style="font-size:10px;color:#888">by Jonathan Mentor</span></div>
<div class="balBox">
<div class="bal">UGX <span id="bal">100,000</span></div>
<button class="btnSmall dep" onclick="openDep()">DEPOSIT</button>
<button class="btnSmall with" onclick="openWith()">WITHDRAW</button>
</div>
</div>
<div class="main">
<div class="left">
<h4>🔴 ALL BETS: <span id="liveCount">1,248</span></h4>
<div id="liveBets"></div>
<h4 style="margin-top:10px">💬 CHAT</h4>
<div style="font-size:10px;color:#aaa">
<div>🔥 User_UG: Cashed 12x!</div>
<div>💰 Mentor: Big win 45x!</div>
<div>✈️ Jon: I love this game</div>
</div>
</div>
<div class="center">
<div class="hist" id="hist"></div>
<div id="game"><canvas id="cv"></canvas><div id="plane">✈️</div><div id="center2"><div id="mult">1.00x</div><div id="flew">FLEW AWAY!</div></div></div>
<div class="betArea">
<div class="betCard">
<div class="tabs"><button class="active">BET</button><button onclick="alert('Auto - Coming Soon')">AUTO</button></div>
<div class="inputRow"><button onclick="ch(1,-100)">−</button><input id="s1" inputmode="numeric" value="1000"><button onclick="ch(1,100)">+</button></div>
<div class="grid4"><button onclick="setS(1,500)">500</button><button onclick="setS(1,1000)">1,000</button><button onclick="setS(1,5000)">5,000</button><button onclick="setS(1,10000)">10K</button></div>
<button id="b1" class="betBtn green" onclick="bet(1)">BET <span id="b1t">1,000 UGX</span></button>
</div>
<div class="betCard">
<div class="tabs"><button class="active">BET</button><button onclick="alert('Auto - Coming Soon')">AUTO</button></div>
<div class="inputRow"><button onclick="ch(2,-100)">−</button><input id="s2" inputmode="numeric" value="1000"><button onclick="ch(2,100)">+</button></div>
<div class="grid4"><button onclick="setS(2,500)">500</button><button onclick="setS(2,1000)">1,000</button><button onclick="setS(2,5000)">5,000</button><button onclick="setS(2,10000)">10K</button></div>
<button id="b2" class="betBtn green" onclick="bet(2)">BET <span id="b2t">1,000 UGX</span></button>
</div>
</div>
</div>
</div>
<div class="modal" id="depModal"><div class="modalBox"><h3>💰 Deposit</h3><p style="font-size:12px;color:#aaa">MTN MoMo / Airtel Money</p><input id="depPhone" placeholder="077XXXXXXX"><input id="depAmt" type="number" placeholder="Amount (UGX)"><button style="background:#22c55e" onclick="doDep()">DEPOSIT NOW</button><button style="background:#333" onclick="closeMod()">CANCEL</button></div></div>
<div class="modal" id="withModal"><div class="modalBox"><h3>💸 Withdraw</h3><input id="withPhone" placeholder="077XXXXXXX"><input id="withAmt" type="number" placeholder="Amount (UGX)"><button style="background:#f59e0b" onclick="doWith()">WITHDRAW NOW</button><button style="background:#333" onclick="closeMod()">CANCEL</button><p style="font-size:10px;color:#888;margin-top:8px">Min 1,000 UGX • Instant to Mobile Money</p></div></div>
<script>
let bal=100000, mult=1, flying=false, pts=[], hist=document.getElementById('hist'), cv=document.getElementById('cv'), ctx=cv.getContext('2d'), plane=document.getElementById('plane'), multEl=document.getElementById('mult'), flew=document.getElementById('flew'), game=document.getElementById('game');
let s1=document.getElementById('s1'), s2=document.getElementById('s2'), b1=document.getElementById('b1'), b2=document.getElementById('b2'), b1t=document.getElementById('b1t'), b2t=document.getElementById('b2t'), balEl=document.getElementById('bal'), liveBets=document.getElementById('liveBets');
let bet1={stake:1000,inGame:false,canCash:false}, bet2={stake:1000,inGame:false,canCash:false};
function resize(){ let r=game.getBoundingClientRect(); cv.width=r.width; cv.height=r.height; }
window.addEventListener('resize',resize); resize();
function ch(n,d){ let el=n==1?s1:s2; let v=(parseInt(el.value)||1000)+d; if(v<100) v=100; el.value=v; upd(n); }
function setS(n,v){ (n==1?s1:s2).value=v; upd(n); }
function upd(n){ let v=parseInt((n==1?s1:s2).value)||0; if(n==1){bet1.stake=v; b1t.innerText=v.toLocaleString()+' UGX';}else{bet2.stake=v; b2t.innerText=v.toLocaleString()+' UGX';} }
function draw(){ let w=cv.width,h=cv.height; ctx.clearRect(0,0,w,h); if(pts.length<2) return; ctx.beginPath(); ctx.strokeStyle='#e11d48'; ctx.lineWidth=4; ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke(); ctx.lineTo(pts[pts.length-1].x,h); ctx.lineTo(pts[0].x,h); ctx.closePath(); ctx.fillStyle='rgba(225,29,72,0.25)'; ctx.fill(); }
function addH(m){ let s=document.createElement('span'); s.innerText=m.toFixed(2)+'x'; s.style.color=m<2?'#94a3b8':m<10?'#60a5fa':'#22c55e'; s.style.background=m<2?'#1e293b':m<10?'#1e3a5f':'#14532d'; hist.prepend(s); if(hist.children.length>25) hist.lastChild.remove(); }
function addLive(user,amt,cash){ let d=document.createElement('div'); d.className='betItem'; d.innerHTML=`<span>${user}</span><b>${cash? (amt.toFixed(2)+'x • UGX '+(amt*500).toFixed(0)) : 'UGX '+amt}</b>`; liveBets.prepend(d); if(liveBets.children.length>18) liveBets.lastChild.remove(); }
setInterval(()=>{ let names=['UG_7*','Mentor*','Jon*','Pro*','KLA*']; addLive(names[Math.floor(Math.random()*names.length)], Math.floor(Math.random()*5000)+500, Math.random()>0.5? (1+Math.random()*10):0); document.getElementById('liveCount').innerText=(1200+Math.floor(Math.random()*300)); },900);
function bet(n){
 let B=n==1?bet1:bet2, btn=n==1?b1:b2, el=n==1?s1:s2; let stake=parseInt(el.value)||0; B.stake=stake;
 if(flying && B.inGame && B.canCash){
   let win=Math.floor(B.stake*mult); bal+=win; balEl.innerText=bal.toLocaleString(); B.inGame=false; B.canCash=false; btn.className='betBtn green'; btn.innerHTML='BET <span>'+B.stake.toLocaleString()+' UGX</span>'; multEl.innerText='WIN '+win.toLocaleString(); multEl.style.color='#22c55e'; return;
 }
 if(!flying &&!B.inGame){
   if(stake>bal){alert('Insufficient balance! Deposit now.'); openDep(); return;}
   bal-=stake; balEl.innerText=bal.toLocaleString(); B.inGame=true; B.canCash=false; btn.className='betBtn grey'; btn.innerHTML='WAITING <span>NEXT ROUND</span>';
 }
}
function startRound(){
 mult=1; flying=false; pts=[]; flew.style.display='none'; multEl.style.color='#fff'; multEl.innerText='1.00x';
 setTimeout(()=>{
   flying=true; [bet1,bet2].forEach(B=>{ if(B.inGame) B.canCash=true; });
   let crash = Math.random()<0.08? 1.05+Math.random()*0.9 : Math.random()<0.6? 1.2+Math.random()*4 : 2+Math.pow(Math.random(),1.5)*100;
   let t0=Date.now();
   function loop(){
     if(!flying) return;
     let e=(Date.now()-t0)/1000; mult=1+ e*0.65 + Math.pow(e,1.88)*0.055;
     let w=cv.width,h=cv.height; let prog=e/6; if(prog>1) prog=1; let x=prog*w*0.85; let y=h*0.88 - prog*h*0.75 - Math.pow(prog,2)*h*0.08; if(y<h*0.05) y=h*0.05;
     pts.push({x,y}); if(pts.length>300) pts.shift(); draw(); plane.style.left=(x-14)+'px'; plane.style.top=(y-14)+'px'; plane.style.transform='rotate('+( -10+prog*25)+'deg)';
     if(multEl.style.color=='#fff' || multEl.innerText.includes('x')){ multEl.innerText=mult.toFixed(2)+'x'; }
     [bet1,bet2].forEach((B,i)=>{ let btn=i==0?b1:b2; if(B.inGame && B.canCash){ let cash=Math.floor(B.stake*mult); btn.className='betBtn orange'; btn.innerHTML='CASH OUT <span>'+cash.toLocaleString()+' UGX</span>'; } });
     if(mult>=crash){
       flying=false; multEl.style.color='#e11d48'; flew.style.display='block'; multEl.innerText=mult.toFixed(2)+'x';
       [bet1,bet2].forEach((B,i)=>{ if(B.inGame && B.canCash){ B.inGame=false; B.canCash=false; let btn=i==0?b1:b2; btn.className='betBtn green'; btn.innerHTML='BET <span>'+B.stake.toLocaleString()+' UGX</span>'; } });
       addH(mult); setTimeout(startRound,3000); return;
     }
     requestAnimationFrame(loop);
   }
   loop();
 },800);
}
function openDep(){ document.getElementById('depModal').style.display='flex'; }
function openWith(){ document.getElementById('withModal').style.display='flex'; }
function closeMod(){ document.getElementById('depModal').style.display='none'; document.getElementById('withModal').style.display='none'; }
function doDep(){
 let p=document.getElementById('depPhone').value, a=parseInt(document.getElementById('depAmt').value);
 if(!p ||!a || a<1000){alert('Enter valid phone & min 1000 UGX'); return;}
 bal+=a; balEl.innerText=bal.toLocaleString(); closeMod(); alert('✅ Deposit UGX '+a.toLocaleString()+' received from '+p+'!\nBalance updated.');
}
function doWith(){
 let p=document.getElementById('withPhone').value, a=parseInt(document.getElementById('withAmt').value);
 if(!p ||!a){alert('Enter phone & amount'); return;}
 if(a>bal){alert('Insufficient balance'); return;}
 if(a<1000){alert('Min 1000 UGX'); return;}
 bal-=a; balEl.innerText=bal.toLocaleString(); closeMod(); alert('✅ Withdraw Sent!\n\nUGX '+a.toLocaleString()+' to '+p+'\nYou will receive Mobile Money in 2 mins!\n\nJonathan Mentor Aviator');
}
s1.addEventListener('input',()=>upd(1)); s2.addEventListener('input',()=>upd(2));
upd(1); upd(2); startRound();
</script>
</body>
 </html>
