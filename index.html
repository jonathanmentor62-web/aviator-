<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JONATHAN AVIATOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;font-family:Arial}
.banner{width:100%;height:135px;background:#000 url('IMG-20260827-WA8619.jpg') center/cover no-repeat;border-bottom:3px solid #d4af37}
.hero{background:linear-gradient(#1a3c0a,#0e1e08);padding:14px;text-align:center}
.hero h1{color:#ffcc00;font-size:18px}
.momo{background:#000;color:#ffcc00;padding:8px 18px;border-radius:20px;font-weight:bold;display:inline-block;margin:8px;border:1px solid #ffcc00}
.btn{padding:10px 16px;border-radius:20px;font-weight:bold;border:none;margin:4px;font-size:12px}
.btn-r{background:#e60000;color:#fff}.btn-w{background:#222;border:1px solid #fff;color:#fff}.btn-j{border:1px solid #d4af37;color:#d4af37;background:#111}
.card{background:#141e12;margin:10px;border-radius:12px;overflow:hidden}
.preview{background:radial-gradient(circle,#2a4a1f,#0a0e1a);padding:20px;text-align:center;position:relative;min-height:260px}
.lock{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;justify-content:center;align-items:center}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:9999;padding:15px}
.box{background:#1a1a1a;border:2px solid #d4af37;border-radius:15px;padding:20px;width:100%;max-width:350px;text-align:center}
.box input{width:100%;padding:12px;margin:7px 0;background:#0a0e1a;border:1px solid #444;color:#fff;border-radius:8px}
#realGame{position:fixed;top:0;left:0;width:100%;height:100%;background:#0e141e;z-index:5000;display:none}
.betrow{display:flex;padding:10px;gap:10px}
.betrow input{flex:1;padding:12px;background:#0a0e1a;border:1px solid #444;color:#fff;border-radius:8px;text-align:center}
.betrow button{flex:1;background:#8dc63f;color:#000;border:none;border-radius:8px;font-weight:900}
</style>
</head>
<body>
<div class="banner" onclick="openJoin()"></div>
<div style="background:#111;padding:7px;display:flex;justify-content:center;gap:12px;font-size:11px"><span>SPORTS</span><span style="color:red">LIVE</span><span>CASINO</span><span>PROMOS</span></div>
<div class="hero">
<h1>✈️ 300% BONUS - 0794650803</h1>
<div class="momo">📲 0794650803</div><br>
<button class="btn btn-r" onclick="openJoin()">+ DEPOSIT</button>
<button class="btn btn-w" onclick="openJoin()">WITHDRAW</button>
<button class="btn btn-j" onclick="openJoin()">JOIN NOW</button>
</div>
<div class="card">
<div style="padding:10px;background:#1f2f1a;display:flex;justify-content:space-between;font-size:12px"><span>✈ AVIATOR</span><span style="color:#8dc63f">● LIVE</span></div>
<div class="preview" onclick="openJoin()">
<div id="mult" style="font-size:55px;color:#ffcc00;font-weight:900">1.00x</div><div style="font-size:45px">✈️</div>
<div class="lock"><p>🔒 LOGIN & DEPOSIT TO PLAY</p><button class="btn btn-r" style="margin-top:10px" onclick="openJoin()">LOGIN TO BET</button><p style="font-size:11px;margin-top:6px">Deposit UGX 2000 to 0794650803</p></div>
</div>
<div class="betrow"><input value="1000"><button onclick="openJoin()">BET</button></div>
</div>
<div id="joinModal" class="modal"><div class="box">
<img src="IMG-20260827-WA6354.jpg" style="width:70px;height:70px;border-radius:50%;border:2px solid gold;object-fit:cover">
<h3 style="color:#ffcc00;margin:10px 0">JOIN NOW</h3>
<input id="jName" placeholder="Full Name">
<input id="jPhone" placeholder="Phone">
<input id="jDep" type="number" placeholder="Amount sent to 0794650803">
<button onclick="activate()" style="width:100%;padding:13px;background:#e60000;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:10px">I DEPOSITED - PLAY NOW</button>
<button onclick="closeM()" style="width:100%;padding:10px;background:#333;color:#fff;border:none;border-radius:8px;margin-top:8px">CLOSE</button>
</div></div>
<div id="realGame">
<div style="background:#000;padding:12px;display:flex;justify-content:space-between"><span style="color:gold;font-weight:900">JONATHAN AVIATOR</span><div><span id="bal" style="background:#ffcc00;color:#000;padding:5px 12px;border-radius:15px;font-weight:bold">UGX 0</span><button onclick="document.getElementById('realGame').style.display='none'" style="background:#333;color:#fff;border:none;padding:5px 10px;border-radius:10px;margin-left:6px">X</button></div></div>
<div style="background:radial-gradient(circle,#2a4a1f,#0a0e1a);padding:40px 20px;text-align:center;min-height:340px"><div id="realMult" style="font-size:70px;color:#ffcc00;font-weight:900">1.00x</div><div style="font-size:50px">✈️</div><p id="realStat" style="margin-top:15px">Waiting...</p></div>
<div class="betrow"><input id="realBet" value="1000" type="number"><button id="realBtn" onclick="playReal()">PLACE BET</button></div>
</div>
<script>
let bal=parseInt(localStorage.getItem('bal'))||0;let bet=0;let m=1;let iv;
function openJoin(){document.getElementById('joinModal').style.display='flex';}
function closeM(){document.getElementById('joinModal').style.display='none';}
function activate(){let dep=document.getElementById('jDep').value;let name=document.getElementById('jName').value;if(!name||!dep||dep<2000){alert('Enter name & deposit 2000+ to 0794650803');return}bal+=parseInt(dep);localStorage.setItem('bal',bal);closeM();document.getElementById('realGame').style.display='block';document.getElementById('bal').innerText='UGX '+bal;}
function playReal(){if(bet>0){let win=Math.floor(bet*m);bal+=win;localStorage.setItem('bal',bal);document.getElementById('bal').innerText='UGX '+bal;clearInterval(iv);alert('WIN UGX '+win);document.getElementById('realBtn').innerText='PLACE BET';bet=0;m=1;document.getElementById('realMult').innerText='1.00x';return;}let amt=parseInt(document.getElementById('realBet').value);if(amt>bal){alert('Low balance! Deposit 0794650803');return}bet=amt;bal-=amt;document.getElementById('bal').innerText='UGX '+bal;document.getElementById('realBtn').innerText='CASHOUT';m=1;iv=setInterval(()=>{m+=0.15;document.getElementById('realMult').innerText=m.toFixed(2)+'x';document.getElementById('realBtn').innerText='CASHOUT '+m.toFixed(2)+'x';if(Math.random()<0.03&&m>1.5){clearInterval(iv);document.getElementById('realStat').innerText='CRASHED '+m.toFixed(2)+'x';document.getElementById('realBtn').innerText='PLACE BET';bet=0;}},100);}
setInterval(()=>{document.getElementById('mult').innerText=(1+Math.random()*3).toFixed(2)+'x';},1400);
</script>
</body>
</html>
