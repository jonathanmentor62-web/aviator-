<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AVIATOR - Jonathan Mentor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
html,body{height:100%;width:100%;background:#0d111c;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;width:100vw}
.top{width:100%;display:flex;flex-direction:column;align-items:center;padding:12px 8px;background:linear-gradient(#151b2b,#0d111c);flex-shrink:0;border-bottom:1px solid #1e2940}
.bigAvatar{width:110px;height:110px;border-radius:50%;border:4px solid #00e676;object-fit:cover;box-shadow:0 0 25px rgba(0,230,118,0.6)}
.name{margin-top:8px;font-size:18px;font-weight:900;color:#fff;letter-spacing:1px}
.sub{font-size:11px;color:#00e676;font-weight:800}
.bal{margin-top:8px;background:#1e2940;padding:6px 18px;border-radius:20px;color:#00e676;font-weight:900;font-size:15px;border:1px solid #2a3a5c}
.hist{display:flex;gap:5px;padding:8px;overflow-x:auto;background:#0d111c;flex-shrink:0;width:100%}
.hist span{padding:4px 10px;border-radius:12px;font-size:13px;font-weight:800;flex-shrink:0;background:#1c2336}
#game{flex:1;width:100%;background:radial-gradient(ellipse at bottom,#1a233a 0%,#080a12 70%);position:relative;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#plane{position:absolute;z-index:2;font-size:30px;left:0;top:0;transition:0.05s}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:3}
#mult{font-size:72px;font-weight:900;color:#fff;text-shadow:0 0 20px rgba(255,255,255,0.3)}
#flew{color:#ff3b3b;display:none;font-size:20px;font-weight:900;margin-top:5px}
.bets{width:100%;display:flex;gap:6px;padding:6px;background:#0d111c;flex-shrink:0}
.card{flex:1;min-width:0;width:50%;background:#1a2236;border-radius:12px;padding:8px;border:1px solid #243150}
.inputBox{width:100%;background:#0f1525;border:1px solid #2a3a5c;border-radius:20px;display:flex;align-items:center;padding:3px}
.inputBox button{width:32px;min-width:32px;height:32px;border-radius:50%;border:none;background:#243150;color:#fff;font-weight:900;font-size:18px}
.inputBox input{flex:1;min-width:0;background:transparent;border:none;color:#fff;text-align:center;font-size:18px;font-weight:900;outline:none}
.quicks{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.quicks button{width:100%;background:#23304e;border:none;color:#aab8d6;padding:7px 0;border-radius:6px;font-size:12px;font-weight:800}
.betBtn{width:100%;margin-top:8px;border:none;border-radius:22px;padding:14px 0;font-weight:900;font-size:15px;color:#fff;cursor:pointer}
.green{background:#00c74d}.orange{background:#ff9f00;animation:pulse 0.6s infinite}.grey{background:#2a395a;color:#6e7ea0}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.foot{text-align:center;padding:4px;color:#4a5a7a;font-size:9px;background:#0d111c;flex-shrink:0}
</style>
</head>
<body>
<div class="top">
<img src="IMG-20260826-WA0039.jpg" class="bigAvatar" onerror="this.src='avatar.jpg';this.onerror=null">
<div class="name">JONATHAN MENTOR ✈️</div>
<div class="sub">AVIATOR KING • UGANDA</div>
<div class="bal">💰 UGX <span id="bal">100,000</span></div>
</div>
<div class="hist" id="hist"></div>
<div id="game"><canvas id="cv"></canvas><div id="plane">✈️</div><div id="center"><div id="mult">1.00x</div><div id="flew">FLEW AWAY!</div></div></div>
<div class="bets">
<div class="card">
<div style="font-size:10px;color:#8a9cc5;margin-bottom:4px;font-weight:800">BET 1</div>
<div class="inputBox"><button onclick="ch(1,-100)">−</button><input id="s1" type="number" value="1000"><button onclick="ch(1,100)">+</button></div>
<div class="quicks"><button onclick="setS(1,500)">500</button><button onclick="setS(1,1000)">1K</button><button onclick="setS(1,2000)">2K</button><button onclick="setS(1,5000)">5K</button></div>
<button id="b1" class="betBtn green" onclick="bet(1)">BET<br><span id="b1t">1,000 UGX</span></button>
</div>
<div class="card">
<div style="font-size:10px;color:#8a9cc5;margin-bottom:4px;font-weight:800">BET 2</div>
<div class="inputBox"><button onclick="ch(2,-100)">−</button><input id="s2" type="number" value="1000"><button onclick="ch(2,100)">+</button></div>
<div class="quicks"><button onclick="setS(2,500)">500</button><button onclick="setS(2,1000)">1K</button><button onclick="setS(2,2000)">2K</button><button onclick="setS(2,5000)">5K</button></div>
<button id="b2" class="betBtn green" onclick="bet(2)">BET<br><span id="b2t">1,000 UGX</span></button>
</div>
</div>
<div class="foot">JONATHAN MENTOR AVIATOR</div>
<script>
let bal=100000, mult=1, flying=false, crash=2, pts=[], roundId=0;
let cv=document.getElementById('cv'), ctx=cv.getContext('2d'), plane=document.getElementById('plane'), multEl=document.getElementById('mult'), flew=document.getElementById('flew'), hist=document.getElementById('hist'), game=document.getElementById('game');
let s1=document.getElementById('s1'), s2=document.getElementById('s2'), b1=document.getElementById('b1'), b2=document.getElementById('b2'), b1t=document.getElementById('b1t'), b2t=document.getElementById('b2t'), balEl=document.getElementById('bal');
let B1={stake:1000,placed:false,active:false,round:-1}, B2={stake:1000,placed:false,active:false,round:-1};
function resize(){ let r=game.getBoundingClientRect(); cv.width=r.width; cv.height=r.height; }
window.addEventListener('resize',resize); resize();
function upd(n){ let el=n==1?s1:s2; let v=parseInt(el.value)||0; if(n==1){B1.stake=v; b1t.innerText=v.toLocaleString()+' UGX';}else{B2.stake=v; b2t.innerText=v.toLocaleString()+' UGX';} }
function ch(n,d){ let el=n==1?s1:s2; let v=(parseInt(el.value)||1000)+d; if(v<100) v=100; el.value=v; upd(n); }
function setS(n,v){ (n==1?s1:s2).value=v; upd(n); }
function draw(){ let w=cv.width,h=cv.height; ctx.clearRect(0,0,w,h); if(pts.length<2) return; ctx.beginPath(); ctx.strokeStyle='#ff1a1a'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke(); ctx.lineTo(pts[pts.length-1].x,h); ctx.lineTo(pts[0].x,h); ctx.closePath(); ctx.fillStyle='rgba(255,26,26,0.25)'; ctx.fill(); }
function addH(m){ let s=document.createElement('span'); s.innerText=m.toFixed(2)+'x'; s.style.color=m<2?'#ff4d4d':m<10?'#7aa3ff':'#00e676'; hist.prepend(s); if(hist.children.length>20) hist.lastChild.remove(); }
function bet(n){
 let B=n==1?B1:B2, btn=n==1?b1:b2;
 let stake=parseInt((n==1?s1:s2).value)||0;
 if(stake<100){alert('Min 100 UGX'); return;}
 B.stake=stake;
 // CASH OUT
 if(flying && B.placed && B.active && B.round==roundId){
   let win=Math.floor(B.stake*mult);
   bal+=win; balEl.innerText=bal.toLocaleString();
   B.placed=false; B.active=false;
   btn.className='betBtn green';
   btn.innerHTML=`BET<br><span>${B.stake.toLocaleString()} UGX</span>`;
   return;
 }
 // PLACE BET
 if(!B.placed){
   if(stake>bal){alert('No balance Boss!'); return;}
   bal-=stake; balEl.innerText=bal.toLocaleString();
   B.placed=true; B.round=roundId+1;
   if(flying){
     // bet for next round
     btn.className='betBtn grey';
     btn.innerHTML=`BET FOR NEXT<br><span>${stake} UGX</span>`;
   } else {
     btn.className='betBtn grey';
     btn.innerHTML=`WAITING<br><span>${stake} UGX</span>`;
   }
 }
}
function start(){
 mult=1; flying=false; pts=[]; roundId++;
 flew.style.display='none'; multEl.style.color='#fff'; multEl.innerText='1.00x';
 // activate bets placed for this round
 [B1,B2].forEach(B=>{
   if(B.placed && B.round==roundId){
     B.active=true;
   }
 });
 setTimeout(()=>{
   flying=true; crash = Math.random()<0.18? 1.05+Math.random()*0.9 : 1.2+Math.pow(Math.random(),1.3)*25;
   let t0=Date.now();
   function loop(){
     if(!flying) return;
     let e=(Date.now()-t0)/1000;
     mult=1+ e*0.6 + Math.pow(e,1.9)*0.05;
     let w=cv.width,h=cv.height;
     let x=(mult-1)*w*0.17; if(x>w-34) x=w-34;
     let y=h - (mult-1)*h*0.13 - h*0.22; if(y<18) y=18;
     pts.push({x,y}); if(pts.length>200) pts.shift();
     draw(); plane.style.left=(x-14)+'px'; plane.style.top=(y-18)+'px';
     multEl.innerText=mult.toFixed(2)+'x';
     [B1,B2].forEach((B,i)=>{
       let btn=i==0?b1:b2;
       if(B.placed && B.active && B.round==roundId){
         let cash=Math.floor(B.stake*mult);
         btn.className='betBtn orange';
         btn.innerHTML=`CASH OUT<br><span>${cash.toLocaleString()} UGX</span>`;
       }
     });
     if(mult>=crash){
       flying=false;
       multEl.style.color='#ff3b3b'; flew.style.display='block';
       // lose uncashed bets
       [B1,B2].forEach((B,i)=>{
         if(B.placed && B.active && B.round==roundId){
           B.placed=false; B.active=false;
           let btn=i==0?b1:b2;
           btn.className='betBtn green';
           btn.innerHTML=`BET<br><span>${B.stake.toLocaleString()} UGX</span>`;
         } else if(B.placed && B.round==roundId){
           // was waiting but round started? keep for next? Actually this bet should be active
           B.active=true;
         }
       });
       // reset waiting bets for next round
       [B1,B2].forEach((B,i)=>{
         if(B.placed && B.round>roundId){
           let btn=i==0?b1:b2;
           btn.className='betBtn grey';
           btn.innerHTML=`WAITING<br><span>${B.stake} UGX</span>`;
         }
       });
       // bets that were for next round now become waiting
       addH(mult);
       setTimeout(start,2500);
       return;
     }
     requestAnimationFrame(loop);
   }
   loop();
 }, 800);
}
s1.addEventListener('input',()=>upd(1)); s2.addEventListener('input',()=>upd(2));
upd(1); upd(2); start();
</script>
</body>
 </html>
