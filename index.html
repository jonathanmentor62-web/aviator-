<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AVIATOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
html,body{height:100%;background:#0d111c;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;justify-content:space-between;padding:8px 10px;background:#151b2b;align-items:center;flex-shrink:0}
.bal{background:#1e2940;padding:4px 10px;border-radius:12px;color:#00e676;font-weight:800;font-size:12px}
.hist{display:flex;gap:4px;padding:6px;overflow-x:auto;background:#0d111c;flex-shrink:0;min-height:30px}
.hist span{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;flex-shrink:0;background:#1c2336}
#game{flex:1;background:radial-gradient(ellipse at center bottom,#1a233a 0%,#080a12 65%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{position:absolute;inset:0;width:100%;height:100%}
#plane{position:absolute;z-index:2;font-size:26px;left:0;top:50%;transform:translate(0,-50%)}
#center{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;z-index:3}
#mult{font-size:56px;font-weight:900;text-shadow:0 2px 20px rgba(0,0,0,0.8)}
#flew{color:#ff3b3b;display:none;font-size:18px;font-weight:800;margin-top:4px}
.bets{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:#0d111c;flex-shrink:0}
.card{background:#1a2236;border-radius:12px;padding:7px;border:1px solid #243150}
.label{font-size:10px;color:#8a9cc5;display:flex;justify-content:space-between;margin-bottom:4px}
.inputBox{background:#0f1525;border:1px solid #2a3a5c;border-radius:18px;display:flex;align-items:center;padding:3px}
.inputBox button{width:28px;height:28px;border-radius:50%;border:none;background:#243150;color:#fff;font-size:14px;font-weight:900;flex-shrink:0}
.inputBox input{flex:1;background:transparent;border:none;color:#fff;text-align:center;font-size:16px;font-weight:800;outline:none;min-width:0}
.quicks{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
.quicks button{background:#23304e;border:none;color:#aab8d6;padding:6px;border-radius:6px;font-size:11px;font-weight:700}
.betBtn{width:100%;margin-top:6px;border:none;border-radius:22px;padding:11px 0;font-weight:900;font-size:13px;color:#fff}
.green{background:linear-gradient(#00d150,#00a63e);box-shadow:0 3px 0 #007a2d}
.orange{background:linear-gradient(#ffae1a,#ff8c00);box-shadow:0 3px 0 #cc6f00;animation:pulse 0.7s infinite alternate}
.grey{background:#2a395a;color:#6e7ea0}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.02)}}
.hint{font-size:9px;color:#ff9f00;text-align:center;margin-top:3px}
.foot{text-align:center;padding:4px;color:#4a5a7a;font-size:9px;background:#0d111c;flex-shrink:0}
</style>
</head>
<body>
<div class="top"><b style="font-size:15px">AVIATOR ✈ <span style="background:#ff9f00;color:#000;padding:1px 6px;border-radius:4px;font-size:9px">DEMO</span></b><div class="bal">UGX <span id="bal">100,000</span></div></div>
<div class="hist" id="hist"></div>
<div id="game"><canvas id="cv"></canvas><div id="plane">✈️</div><div id="center"><div id="mult">1.00x</div><div id="flew">FLEW AWAY!</div></div></div>

<div class="bets">
<div class="card">
<div class="label"><span>BET 1</span><span style="color:#00e676">● Stake</span></div>
<div class="inputBox"><button onclick="ch(1,-100)">−</button><input id="s1" inputmode="numeric" type="number" value="500" min="500" oninput="upd(1)"><button onclick="ch(1,100)">+</button></div>
<div class="hint">Min 500 UGX - Type your stake</div>
<div class="quicks"><button onclick="setS(1,500)">500</button><button onclick="setS(1,1000)">1K</button><button onclick="setS(1,2000)">2K</button><button onclick="setS(1,5000)">5K</button></div>
<button id="b1" class="betBtn green" onclick="bet(1)">BET<br><span id="b1t" style="font-size:11px">500 UGX</span></button>
</div>
<div class="card">
<div class="label"><span>BET 2</span><span style="color:#00e676">● Stake</span></div>
<div class="inputBox"><button onclick="ch(2,-100)">−</button><input id="s2" inputmode="numeric" type="number" value="500" min="500" oninput="upd(2)"><button onclick="ch(2,100)">+</button></div>
<div class="hint">Min 500 UGX - Type your stake</div>
<div class="quicks"><button onclick="setS(2,500)">500</button><button onclick="setS(2,1000)">1K</button><button onclick="setS(2,2000)">2K</button><button onclick="setS(2,5000)">5K</button></div>
<button id="b2" class="betBtn green" onclick="bet(2)">BET<br><span id="b2t" style="font-size:11px">500 UGX</span></button>
</div>
</div>
<div class="foot">FUN DEMO - You decide stake from 500 UGX | Jonathan Mentor</div>

<script>
let bal=100000, mult=1, flying=false, crash=2, pts=[];
let cv=document.getElementById('cv'), ctx=cv.getContext('2d'), plane=document.getElementById('plane'), multEl=document.getElementById('mult'), flew=document.getElementById('flew'), hist=document.getElementById('hist');
let s1=document.getElementById('s1'), s2=document.getElementById('s2'), b1=document.getElementById('b1'), b2=document.getElementById('b2'), b1t=document.getElementById('b1t'), b2t=document.getElementById('b2t'), balEl=document.getElementById('bal'), game=document.getElementById('game');
let B1={stake:500,placed:false,active:false}, B2={stake:500,placed:false,active:false};

function resize(){
 let r=game.getBoundingClientRect();
 cv.width=r.width*2; cv.height=r.height*2;
 cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
 ctx.setTransform(2,0,0,2,0,0);
}
window.addEventListener('resize',resize); resize();

function upd(n){
 if(n==1){ B1.stake=parseInt(s1.value)||0; b1t.innerText=(B1.stake||500).toLocaleString()+' UGX'; }
 else { B2.stake=parseInt(s2.value)||0; b2t.innerText=(B2.stake||500).toLocaleString()+' UGX'; }
}
function ch(n,d){ let el=n==1?s1:s2; let v=(parseInt(el.value)||500)+d; if(v<500) v=500; el.value=v; upd(n); }
function setS(n,v){ (n==1?s1:s2).value=v; upd(n); }

function draw(){
 let w=cv.width/2, h=cv.height/2;
 ctx.clearRect(0,0,w,h);
 if(pts.length<2) return;
 ctx.beginPath(); ctx.strokeStyle='#ff1a1a'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round';
 ctx.moveTo(pts[0].x,pts[0].y);
 for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
 ctx.stroke();
 ctx.lineTo(pts[pts.length-1].x,h); ctx.lineTo(pts[0].x,h); ctx.closePath();
 let g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'rgba(255,26,26,0.4)'); g.addColorStop(1,'rgba(255,26,26,0)');
 ctx.fillStyle=g; ctx.fill();
}
function addH(m){ let s=document.createElement('span'); s.innerText=m.toFixed(2)+'x'; s.style.color=m<2?'#ff4d4d':m<10?'#7aa3ff':'#00e676'; hist.prepend(s); if(hist.children.length>20) hist.lastChild.remove(); }

function bet(n){
 let B=n==1?B1:B2, el=n==1?s1:s2, btn=n==1?b1:b2;
 let stake=parseInt(el.value);
 if(!stake||stake<500) return alert('Boss, enter stake Min 500 UGX');
 B.stake=stake;
 if(!flying&&!B.placed){
  if(B.stake>bal) return alert('No enough FUN money! Refresh page');
  bal-=B.stake; balEl.innerText=bal.toLocaleString(); B.placed=true;
  btn.className='betBtn grey'; btn.innerHTML='WAITING<br><span style="font-size:10px">NEXT ROUND</span>';
 } else if(flying&&B.placed&&B.active){
  let win=Math.floor(B.stake*mult); bal+=win; balEl.innerText=bal.toLocaleString();
  B.placed=false; B.active=false;
  btn.className='betBtn green'; btn.innerHTML=`BET<br><span style="font-size:11px">${B.stake.toLocaleString()} UGX</span>`;
 }
}

function start(){
 mult=1; flying=true; pts=[]; flew.style.display='none'; multEl.style.color='#fff';
 crash = Math.random()<0.15? 1.1+Math.random()*0.9 : 1.3+Math.pow(Math.random(),1.4)*15;
 let t0=Date.now();
 function loop(){
  if(!flying) return;
  let e=(Date.now()-t0)/1000;
  mult=1+ e*0.45 + Math.pow(e,1.85)*0.035;
  let w=cv.width/2, h=cv.height/2;
  let prog=Math.min(e/12,1);
  let x= prog * w * 0.85 + 10;
  let y= h - (Math.log(mult)*h*0.32) - h*0.15;
  if(y<20) y=20;
  pts.push({x,y}); if(pts.length>120) pts.shift();
  draw();
  plane.style.left=(x-10)+'px'; plane.style.top=(y-18)+'px';
  multEl.innerText=mult.toFixed(2)+'x';
  [B1,B2].forEach((B,i)=>{
   let btn=i==0?b1:b2;
   if(B.placed){ B.active=true; btn.className='betBtn orange'; btn.innerHTML=`CASHOUT<br><span style="font-size:11px">${Math.floor(B.stake*mult).toLocaleString()} UGX</span>`; }
  });
  if(mult>=crash){
   flying=false; multEl.style.color='#ff3b3b'; flew.style.display='block';
   B1.placed=false; B1.active=false; B2.placed=false; B2.active=false;
   b1.className='betBtn green'; b1.innerHTML=`BET<br><span style="font-size:11px">${B1.stake.toLocaleString()} UGX</span>`;
   b2.className='betBtn green'; b2.innerHTML=`BET<br><span style="font-size:11px">${B2.stake.toLocaleString()} UGX</span>`;
   if(mult>1.1) addH(mult);
   setTimeout(start,2200); return;
  }
  requestAnimationFrame(loop);
 }
 loop();
}
upd(1); upd(2); start();
</script>
</body>
  </html>
