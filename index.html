<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HATHAN - Aviator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="banner">
  <img src="IMG-20260827-WA6354.jpg"
       onerror="this.src='banner.jpg'"
       alt="HATHAN">

  <div class="overlay">
    <div class="top">
      <div class="logo">HATHAN</div>

      <div class="rbtns">
        <a href="deposit.html" class="deposit">+ DEPOSIT</a>
        <a href="withdraw.html" class="withdraw">WITHDRAW</a>
        <a href="bet.html" class="join">BET NOW</a>
      </div>
    </div>

    <div class="banner-menu">
      <a href="bet.html">⚽ BET</a>
      <a href="index.html">✈️ AVIATOR</a>
      <a href="casino.html">🎰 CASINO</a>
      <a href="deposit.html">💰 WALLET</a>
    </div>
  </div>
</header>

<nav class="tabs">
  <a href="index.html" class="active">✈️ AVIATOR</a>
  <a href="bet.html">⚽ FOOTBALL</a>
  <a href="casino.html">🎰 CASINO</a>
</nav>

<section class="wallet">
  <div>
    <small>AVAILABLE BALANCE</small>
    <strong><span data-balance>100000</span> UGX</strong>
  </div>
  <a href="deposit.html">+ ADD FUNDS</a>
</section>

<main class="game">

  <div class="game-header">
    <h2>✈️ HATHAN AVIATOR</h2>
    <span id="gameStatus">● READY</span>
  </div>

  <div class="flight">

    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>

    <div id="multiplier">1.00x</div>

    <div id="message">Choose your stake</div>

    <div id="trail"></div>

    <div id="plane">✈️</div>
  </div>

  <div class="controls">

    <div class="bet-options">
      <button data-stake="1000">1K</button>
      <button data-stake="5000">5K</button>
      <button data-stake="10000">10K</button>
      <button data-stake="20000">20K</button>
      <button data-stake="50000">50K</button>
    </div>

    <button id="betButton" class="action bet">
      BET <span id="stakeAmount">1,000</span> UGX
    </button>

    <button id="cashButton" class="action cash">
      CASH OUT
    </button>

  </div>
</main>

<section class="history">
  <h3>RECENT FLIGHTS</h3>
  <div id="historyList"></div>
</section>

<footer>
  Practice-credit simulation only. No real-money deposits or withdrawals.
</footer>

<script src="script.js"></script>
</body>
            </html>
