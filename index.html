
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JONATHAN OUMA AVIATOR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc00">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;font-family:Arial}
.header{background:#141a2e;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ffcc00}
.logo{font-weight:bold;color:#ffcc00}
.balance{background:#ffcc00;color:#000;padding:6px 15px;border-radius:20px;font-weight:bold}
.tabs{display:flex;background:#141a2e}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{border-bottom:3px solid #ffcc00;color:#ffcc00}
.aviator{background:radial-gradient(circle at center,#1a2340,#0a0e1a);padding:15px;text-align:center;min-height:380px}
.multiplier{font-size:75px;font-weight:bold;color:#ffcc00;margin:20px 0}
.bet-panel{background:#141a2e;margin:15px;padding:15px;border-radius:12px}
.bet-input{display:flex;gap:10px;margin:10px 0}
.bet-input input{flex:1;padding:12px;border-radius:8px;border:none;background:#0a0e1a;color:#fff;text-align:center;font-size:18px}
.bet-btn{width:100%;padding:15px;background:#00c853;color:#fff;border:none;border-radius:10px;font-size:20px;font-weight:bold}
.bet-btn.cashout{background:#ff3d00}
.momo-box{background:linear-gradient(135deg,#ffcc00,#ff9900);color:#000;padding:15px;border-radius:12px;margin:15px;text-align:center}
.pay-btn{background:#000;color:#ffcc00;padding:10px 20px;border:none;border-radius:20px;font-weight:bold;margin-top:10px}
.login-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;justify-content:center;align-items:center;z-index:9999}
.login-card{background:#141a2e;padding:25px;border-radius:15px;width:90%;max-width:350px;border:2px solid #ffcc00}
.login-card input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#0a0e1a;color:#fff}
.login-card button{width:100%;padding:12px;background:#ffcc00;color:#000;border:none;border-radius:8px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>

<div id="loginModal" class="login-modal">
<div class="login-card">
<h2 style="color:#ffcc00;text-align:center">JONATHAN AVIATOR</h2>
<p style="text-align:center;margin:10px 0">Login to Play & Win</p>
<input id="username" placeholder="Your Name">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">LOGIN / REGISTER</button>
<p style="font-size:11px;text-align:center;margin-top:10px;opacity:0.7">MoMo Pay: 0794650803</p>
</div>
</div>

<div class="header">
<div class="logo">✈ JONATHAN AVIATOR</div>
<div id="userDisplay">Guest</div>
<div class="balance" id="balance">UGX 0</div>
</div>

<div class="tabs">
<div class="tab active" onclick="showTab('aviator')">Aviator</div>
<div class="tab" onclick="showTab('sports')">Sports</div>
<div class="tab" onclick="showTab('wallet')">Wallet</div>
</div>

<div id="aviatorTab">
<div class="momo-box">
<h3>MTN MoMo Deposit</h3>
<p>Send to: <b>0794650803 - JONATHAN OUMA</b></p>
<button class="pay-btn" onclick="depositPrompt()">I HAVE PAID - CONFIRM</button>
</div>
<div class="aviator">
<div id="multiplier" class="multiplier">1.00x</div>
<div style="font-size:50px">✈️</div>
<p id="status">Waiting for next round...</p>
</div>
<div class="bet-panel">
<div class="bet-input">
<input id="betAmount" type="number" value="1000">
<button onclick="changeBet(500)">+500</button>
<button onclick="changeBet(1000)">+1K</button>
</div>
<button id="betBtn" class="bet-btn" onclick="placeBet()">ADD BET PLEASE</button>
</div>
</div>

<div id="sportsTab" style="display:none;padding:15px">
<h3>Today Matches</h3>
<div style="background:#141a2e;padding:12px;border-radius:10px;margin:10px 0">
<p>Man City vs Arsenal</p>
<button style="background:#ffcc00;border:none;padding:5px 10px;border-radius:5px;margin:5px">1: 2.10</button>
</div>
</div>

<div id="walletTab" style="display:none;padding:15px">
<div style="background:#141a2e;padding:20px;border-radius:12px;text-align:center">
<h3>My Wallet</h3>
<h1 id="walletBal" style="color:#ffcc00;margin:15px 0">UGX 0</h1>
<button class="pay-btn" onclick="depositPrompt()" style="width:100%">DEPOSIT 0794650803</button>
<button onclick="withdraw()" style="width:100%;padding:12px;background:#00c853;color:#fff;border:none;border-radius:8px;margin:10px 0;font-weight:bold">WITHDRAW</button>
</div>
</div>

<script>
let balance = parseInt(localStorage.getItem('bal')) || 0;
let bet = 0; let mult = 1.00; let interval;
function login(){let u=document.getElementById('username').value;if(!u){alert('Enter name');return}localStorage.setItem('user',u);document.getElementById('userDisplay').innerText=u;document.getElementById('loginModal').style.display='none';updateBal();}
let savedUser=localStorage.getItem('user');if(savedUser){document.getElementById('userDisplay').innerText=savedUser;document.getElementById('loginModal').style.display='none';}
function updateBal(){document.getElementById('balance').innerText='UGX '+balance;document.getElementById('walletBal').innerText='UGX '+balance;localStorage.setItem('bal',balance);}
function showTab(t){document.getElementById('aviatorTab').style.display='none';document.getElementById('sportsTab').style.display='none';document.getElementById('walletTab').style.display='none';document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));if(t=='aviator'){document.getElementById('aviatorTab').style.display='block';document.querySelectorAll('.tab')[0].classList.add('active')}if(t=='sports'){document.getElementById('sportsTab').style.display='block';document.querySelectorAll('.tab')[1].classList.add('active')}if(t=='wallet'){document.getElementById('walletTab').style.display='block';document.querySelectorAll('.tab')[2].classList.add('active')}}
function changeBet(a){let inp=document.getElementById('betAmount');inp.value=parseInt(inp.value)+a}
function depositPrompt(){let amt=prompt('How much sent to 0794650803?');if(amt&&!isNaN(amt)){balance+=parseInt(amt);updateBal();alert('Deposit UGX '+amt+' CONFIRMED Boss!');}}
function withdraw(){if(balance<1000){alert('Min 1000');return}let phone=prompt('Enter your MoMo to receive:');if(phone){alert('Withdrawal UGX '+balance+' to '+phone+' will be sent from 0794650803');balance=0;updateBal();}}
function placeBet(){let amount=parseInt(document.getElementById('betAmount').value);if(amount>balance){alert('No balance! Deposit to 0794650803');showTab('wallet');return}if(bet>0){let win=Math.floor(bet*mult);balance+=win;updateBal();clearInterval(interval);document.getElementById('status').innerText='WIN UGX '+win+' at '+mult.toFixed(2)+'x';document.getElementById('betBtn').innerText='ADD BET PLEASE';document.getElementById('betBtn').className='bet-btn';bet=0;mult=1.00;return;}bet=amount;balance-=amount;updateBal();document.getElementById('betBtn').innerText='CASHOUT';document.getElementById('betBtn').className='bet-btn cashout';document.getElementById('status').innerText='Flying...';mult=1.00;interval=setInterval(()=>{mult+=0.05+Math.random()*0.15;document.getElementById('multiplier').innerText=mult.toFixed(2)+'x';if(Math.random()<0.02&&mult>1.5){clearInterval(interval);document.getElementById('status').innerText='CRASHED at '+mult.toFixed(2)+'x';document.getElementById('betBtn').innerText='ADD BET PLEASE';document.getElementById('betBtn').className='bet-btn';bet=0;}},100);}
updateBal();
</script>
</body>
  </html>
