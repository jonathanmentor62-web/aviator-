<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HATHAN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080a14;color:white;font-family:Arial}
.banner{width:100%;height:180px;position:relative;overflow:hidden;background:#000}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(0,0,0,0.3),rgba(0,0,0,0.85));display:flex;flex-direction:column;justify-content:space-between;padding:10px}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start}
.logo{color:#ff0000;font-size:30px;font-weight:900;font-style:italic;text-shadow:2px 2px 4px #000}
.right-btns{display:flex;flex-direction:column;gap:4px}
.right-btns a{padding:5px 10px;border-radius:4px;font-weight:800;font-size:11px;text-decoration:none;text-align:center}
.depo{background:#ffcc00;color:#000}.with{background:rgba(255,255,255,0.2);color:white;border:1px solid #fff;backdrop-filter:blur(5px)}.join{background:#ff0000;color:white}
.bottom-menu{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.bottom-menu a{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:bold;text-decoration:none;color:white;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.3);backdrop-filter:blur(5px)}
.tabs{background:#0d0f19;padding:10px;display:flex;gap:8px;justify-content:center}
.tabs a{padding:8px 18px;border-radius:20px;font-weight:800;font-size:13px;text-decoration:none}
.tab-avi{background:#ffcc00;color:#000}.tab-foot{background:#1a1d2e;color:#aaa;border:1px solid #333}.tab-cas{background:#1a1d2e;color:#aaa;border:1px solid #333}
.box{margin:10px;background:#171a2a;border-radius:14px;padding:20px;text-align:center}
.mult{font-size:55px;color:#ffcc00;font-weight:900}
.bet{padding:14px;width:100%;background:#00e701;border:none;border-radius:10px;font-weight:900;font-size:16px}
</style>
</head>
<body>
<!-- YOUR BANNER PIC IS BACK HERE BOSS -->
<div class="banner">
<img src="IMG-20260827-WA6354.jpg" onerror="this.src='banner.jpg'; this.onerror=function(){this.style.display='none'}">
<div class="banner-overlay">
<div class="top-bar">
<div class="logo">HATHAN</div>
<div class="right-btns">
<a href="deposit.html" class="depo">+ DEPOSIT</a>
<a href="withdraw.html" class="with">WITHDRAW</a>
<a href="join.html" class="join">JOIN NOW</a>
</div>
</div>
<div class="bottom-menu">

<a href="join.html">🔐 JOIN NOW</a>
</div>
</div>
</div>

<div class="tabs">
<a href="index.html" class="tab-avi">✈️ AVIATOR</a>
<a href="bet.html" class="tab-foot">⚽ FOOTBALL</a>
<a href="casino.html" class="tab-cas">🎰 CASINO</a>
</div>

<div class="box">
<h2 style="color:#ffcc00">✈️ HATHAN AVIATOR</h2>
<div class="mult" id="m">1.00x</div>
<div style="font-size:45px" id="pl">✈️</div>
<button id="b" class="bet" onclick="go()">BET 1000 UGX</button>
<button id="c" class="bet" style="background:#ff2222;color:white;display:none" onclick="out()">CASHOUT</button>
<p style="margin-top:10px;color:#666;font-size:12px">Welcome to HATHAN</p>
</div>

<script>
let p=false,cur=1,cr=0,iv;
function go(){if(p)return;p=true;cur=1;cr=(Math.random()*9+1.2).toFixed(2);b.style.display='none';c.style.display='block';iv=setInterval(()=>{cur+=0.07;m.innerHTML=cur.toFixed(2)+'x';if(cur>=cr){clearInterval(iv);m.innerHTML='💥 '+cur.toFixed(2)+'x';b.style.display='block';c.style.display='none';p=false;}},80);}
function out(){clearInterval(iv);b.style.display='block';c.style.display='none';p=false;}
</script>
</body>
